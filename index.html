const continentList=['Africa','Asia','Europe','North America','South America','Oceania'];
const africaCountries=[...new Set(R.map(r=>r.country))];
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const nav=(route)=>`<header class="nav"><div class="wrap navinner"><a href="#/" class="brand"><span class="brandmark">◌</span>World Music Experiment</a><button class="mobilemenu" id="menu" aria-label="Open navigation">☰ Menu</button><nav class="links" id="links"><a class="${route==='/'?'active':''}" href="#/">Home</a><a class="${route.startsWith('/explore')||route.startsWith('/africa')||route.startsWith('/country')?'active':''}" href="#/explore">Explore Music</a><a href="#/crossroads" class="${route==='/crossroads'?'active':''}">Musical Crossroads</a><a href="#/discoveries">Group Discoveries</a><a href="#/about">About</a><a href="#/participate" class="${route==='/participate'?'active':''}">Participate</a><a class="invite" href="#/suggest">Suggest Music ↗</a></nav></div></header>`;
const footer=()=>`<footer class="footer"><div class="wrap footerinner"><div><strong>WORLD MUSIC EXPERIMENT</strong><div>Listen first. Discover without ranking.</div></div><div>Library → Journal → Archive → Laboratory<br><span class="status">Public listening library · Research participation by invitation only</span></div></div></footer>`;
function map(){return `<div class="map-frame"><img src="${mapSrc}" alt="Equal Earth equal-area world map with country boundaries, preserving comparative land areas"></div><div class="map-foot"><span>Equal Earth projection · Countries shown at proportional area</span><span>Browse by continent using the cards below ↓</span></div>`;}
const tiles=()=>`<div class="tiles">${continentList.map((c,i)=>`<a class="region ${i===0?'active':'locked'}" href="${i===0?'#/africa':'#/explore'}" aria-label="Explore ${c}"><span class="caps">${i===0?'OPEN COLLECTION':'FUTURE COLLECTION'}</span><b>${c}</b><small>${i===0?'18 cataloged recordings across 3 expeditions':'Collections will appear as research expands'}</small></a>`).join('')}</div>`;
function home(){return `<section class="hero"><div class="wrap"><div class="eyebrow">An ongoing listening expedition</div><h1>One world.<br><em>Countless musical expressions.</em></h1><p class="lead">Explore the living diversity of humanity's music—across continents, communities and centuries. Listen, reflect, and discover musical expressions that may be entirely new to you.</p>${map()}</div></section><section class="section"><div class="wrap"><div class="sectionhead"><div><div class="caps">Global exploration</div><h2>Choose a part of the world</h2><p class="intro">The map preserves geographic scale. Music, however, crosses every border. Start with Africa, our first active collection.</p></div></div>${tiles()}</div></section><section class="section soft"><div class="wrap"><div class="sectionhead"><div><div class="caps">Multiple pathways</div><h2>There is more than one way to listen</h2></div></div><div class="features"><a class="feature" href="#/africa"><span class="symbol">◎</span><h3>Geographic discovery</h3><p>Begin with continents, regions, countries and communities.</p></a><a class="feature" href="#/explore"><span class="symbol">≋</span><h3>Traditions and forms</h3><p>Browse musical lineages and musical characteristics without ranking them.</p></a><a class="feature" href="#/crossroads"><span class="symbol">⤳</span><h3>Musical crossroads</h3><p>Explore documented cultural encounters, migration and transformation.</p></a></div></div></section><section class="section"><div class="wrap two"><div><div class="caps">First collection · Africa</div><h2>Ancient roots. Living traditions. Constant invention.</h2><p class="intro">From ekonting and kora to Afrobeat, Ethio-jazz and amapiano, our growing collection opens only a small window into a vast musical world.</p><a href="#/africa" class="action" style="display:inline-flex;padding:13px 23px">Explore Africa →</a></div><div class="panel"><div class="caps">Discover, then contribute</div><h2>Your listening matters</h2><p class="intro">We want to learn what people hear, what surprises them, and what associations they make. Our research journals are reserved for invited contributors. Interested in a future invitation?</p><a href="#/participate" class="inline-link">Learn about participation →</a></div></div></section>`;}
function breadcrumbs(parts){return `<div class="bread"><a href="#/">Home</a> / ${parts.map(p=>p.href?`<a href="${p.href}">${safe(p.text)}</a>`:safe(p.text)).join(' / ')}</div>`;}
function recordingCard(r){return `<article class="card"><div class="cover" style="--c1:${safe(r.c1)};--c2:${safe(r.c2)}"><span class="id">${safe(r.id)} · AFRICA</span><div class="covertext">${safe(r.tradition)}</div></div><div class="cardmain"><div class="caps">${safe(r.region)} · ${safe(r.country)}</div><h3>${safe(r.title)}</h3><div class="meta">${safe(r.artist)} · ${safe(r.period)}</div><p>${safe(r.description)}</p><span class="tag">${r.listen.includes("youtube.com/watch")?"Full session · KEXP / YouTube":"Playback access: confirm at source"}</span>${r.listen.includes("youtube.com/watch")?'<p class="note">Optional reflection: Did the musicians’ movement, interaction or expression change how you experienced the music?</p>':""}<div class="actions"><a href="${safe(r.listen)}" target="_blank" rel="noopener noreferrer" class="action">▶ Listen</a><a href="${safe(r.journal)}" target="_blank" rel="noopener noreferrer" class="action secondary">✎ My Journal</a></div></div></article>`;}
function filterPanel(list, idPrefix, heading){return `<div class="searchrow"><input class="searchbox" id="${idPrefix}query" type="search" placeholder="Search recordings, traditions, artists..." aria-label="Search music"><select class="select" id="${idPrefix}era" aria-label="Filter by era"><option value="all">All eras</option><option>Living traditions</option><option>20th-century transformations</option><option>Contemporary</option></select></div><div class="meta" id="${idPrefix}count"></div><div class="cardgrid" id="${idPrefix}grid" style="margin-top:18px"></div>`;}
function bindFilters(idPrefix,list){const search=document.getElementById(idPrefix+'query'),era=document.getElementById(idPrefix+'era'),grid=document.getElementById(idPrefix+'grid'),count=document.getElementById(idPrefix+'count');function render(){const q=search.value.toLowerCase().trim(),e=era.value;const found=list.filter(r=>(e==='all'||r.period===e)&&[r.title,r.artist,r.tradition,r.country,r.region,r.id].join(' ').toLowerCase().includes(q));count.textContent=`${found.length} selection${found.length===1?'':'s'} shown`;grid.innerHTML=found.length?found.map(recordingCard).join(''):`<div class="no-results">No recordings match these filters. Try a different tradition, artist or era.</div>`}search.addEventListener('input',render);era.addEventListener('change',render);render()}
function africa(){return `<section class="countryhero"><div class="wrap">${breadcrumbs([{text:'Explore Music',href:'#/explore'},{text:'Africa'}])}<div class="eyebrow">Continent collection</div><h1>Africa: <span style="font-weight:350;color:#bbd7d3">a living musical landscape</span></h1><p class="lead">Explore historical recordings, living traditions, twentieth-century innovation and contemporary sounds. Every tradition has its own musical history, and every recording is a starting point.</p><div class="pills"><span class="pill">18 selections</span><span class="pill">3 listening expeditions</span><span class="pill">Traditions · Transformations · Contemporary</span></div></div></section><section class="section"><div class="wrap"><div class="sectionhead"><div><div class="caps">Find a place</div><h2>Countries represented</h2></div></div><div class="tiles">${africaCountries.map(country=>`<a href="#/country/${encodeURIComponent(country)}" class="region" style="min-height:130px"><div class="caps">AFRICA · ${R.filter(r=>r.country===country).length} recording(s)</div><b style="font-size:21px">${safe(country)}</b><small>Explore the music →</small></a>`).join('')}</div></div></section><section class="section soft"><div class="wrap"><div class="sectionhead"><div><div class="caps">Listening library</div><h2>All Africa recordings</h2><p class="intro">Select a recording to hear it at its source, then open the journal prefilled with the same selection. Audio access must be confirmed before public release.</p></div></div>${filterPanel(R,'africa')}</div></section>`;}
function country(name){const selected=R.filter(r=>r.country===name);if(!selected.length)return explore();let regions=[...new Set(selected.map(r=>r.region))];let traditions=[...new Set(selected.map(r=>r.tradition))];return `<section class="countryhero"><div class="wrap">${breadcrumbs([{text:'Explore Music',href:'#/explore'},{text:'Africa',href:'#/africa'},{text:name}])}<div class="eyebrow">${safe(regions.join(' / '))} · Africa</div><h1>Explore ${safe(name)}</h1><p class="lead">A growing selection of recordings associated with ${safe(name)}. Explore multiple eras and musical forms without assuming that a small sample represents the whole country.</p><div class="pills"><span class="pill">${selected.length} cataloged recording(s)</span>${traditions.map(t=>`<span class="pill">${safe(t)}</span>`).join('')}</div></div></section><section class="section"><div class="wrap two"><div><div class="caps">Country collection</div><h2>Music across time</h2><p class="intro">The selections below include historical documentation and modern creative work. Traditional practices are living forms too; the date of a recording is not the origin date of its musical lineage.</p></div><div class="panel"><div class="caps">A research note</div><p>Country, recording location and cultural ancestry may differ. Some traditions cross national borders and diasporic communities. The archive preserves these distinctions for later study.</p></div></div></section><section class="section soft"><div class="wrap"><div class="sectionhead"><div><div class="caps">Listening selection</div><h2>Hear the recordings</h2><p class="intro">Open a recording at its original source. Then open the linked journal, which already identifies that selection.</p></div></div>${filterPanel(selected,'country')}</div></section><section class="minihero"><div class="wrap"><a href="#/africa" class="inline-link">← Back to all Africa recordings</a></div></section>`;}
function explore(){return `<section class="countryhero"><div class="wrap">${breadcrumbs([{text:'Explore Music'}])}<div class="eyebrow">Global discovery</div><h1>Explore the world through music</h1><p class="lead">Browse by continent or search our active catalog. The research starts in Africa and expands as we verify recordings and document musical traditions around the world.</p></div></section><section class="section"><div class="wrap"><h2>Continents</h2>${tiles()}</div></section><section class="section soft"><div class="wrap"><h2>Available recordings</h2>${filterPanel(R,'explore')}</div></section>`;}
function crossroads(){return `<section class="countryhero"><div class="wrap"><div class="eyebrow">Musical connections</div><h1>Musical Crossroads</h1><p class="lead">Music moves with people. This future research space will trace documented musical exchanges, diasporas, independent innovation and cultural transformation across geography.</p></div></section><section class="section"><div class="wrap features"><div class="feature"><span class="symbol">⤳</span><h3>African Diaspora</h3><p>Explore musical forms developed by African-descended communities beyond Africa, with connections documented rather than assumed.</p></div><div class="feature"><span class="symbol">◌</span><h3>Indian Ocean</h3><p>Investigate connected and distinct histories of East Africa, South Asia, Southeast Asia and island communities.</p></div><div class="feature"><span class="symbol">≋</span><h3>Shared techniques</h3><p>Compare apparent similarities and distinguish historical exchange from independent development.</p></div></div></section>`;}
function discoveries(){return `<section class="countryhero"><div class="wrap"><div class="eyebrow">Collective listening</div><h1>Group Discoveries</h1><p class="lead">This will share curated group-level findings once the invited research collective has built a meaningful body of observations.</p></div></section><section class="section"><div class="wrap two"><div class="panel"><h2>Listening progress</h2><p>18 music selections cataloged · Africa is our first collection. Free playback varies by provider; access is still being reviewed.</p><p class="note">No individual contributor information or private response text is displayed here.</p></div><div class="panel"><h2>What we will explore</h2><p>What listeners hear, what surprises them, what associations they make, and which unfamiliar musical ideas invite deeper exploration. Personal reactions remain distinct from researched claims about a tradition.</p></div></div></section>`;}
function about(){return `<section class="countryhero"><div class="wrap"><div class="eyebrow">Mission and method</div><h1>About the Experiment</h1><p class="lead">A collaborative journey of musical discovery. We do not claim authority over the traditions we encounter: they have their own histories, communities, practitioners, audiences, and expertise.</p></div></section><section class="section"><div class="wrap two"><div><h2>We are here to discover, not to define</h2><p class="intro">There is far more music in the world than any of us can hope to know. We begin as curious listeners, not authorities who bestow recognition or legitimacy. Every musical expression already has its own place, history, communities, practitioners and audiences—whether or not we have encountered it.</p><p class="intro">We listen to learn. We welcome corrections, deeper context and perspectives from the people who make, carry and study these traditions. Our research aims to distinguish documented musical facts from our own reactions and associations.</p><h2>What happens when we listen?</h2><p class="intro">We want to learn what people hear, what surprises them, and what associations they make. The experience of meeting unfamiliar music is personal; there is no requirement to be a musician or music scholar to describe it. Personal impressions are valuable as impressions, not substitutes for cultural or historical expertise.</p><h2>Musical histories are alive</h2><p class="intro">Music travels through migration, trade, collaboration, colonization and technological change. Recordings reveal particular performances, not entire civilizations. Video can illuminate gesture, movement and the relationships between performers, as well as sound. Living traditions and contemporary innovations alike call for careful documentation, not simplistic rankings.</p><h2>Explore what could become possible</h2><p class="intro">Research, listening notes and musical fingerprints may eventually support a creative Laboratory where independently documented musical techniques can be recombined and heard.</p></div><div class="panel"><h2>How to participate</h2><p>Approved contributors browse the library, listen at the linked source, then open a journal with the selected recording prefilled. Verified Google email identifies each participant privately.</p><p class="note">Journal access is granted separately to invited contributors; the public website does not create research accounts or expose the private archive.</p></div></div></section>`;}
function participate(){return `<section class="countryhero"><div class="wrap"><div class="eyebrow">World Music Experiment / Participate</div><h1>Listen. Discover. <span style="color:#b9d9d3;font-weight:350">Contribute.</span></h1><p class="lead">The world's music is open to everyone. Our collaborative listening research is conducted by a small community of invited contributors.</p></div></section><section class="section"><div class="wrap two"><div><div class="caps">Explore freely</div><h2>Everyone is welcome to listen.</h2><p class="intro">Browse music from different countries, learn about traditions and forms, and follow authorized recording links. You do not need an account or musical training to enjoy the library.</p><a href="#/explore" class="inline-link">Explore the listening library →</a></div><div class="panel"><div class="caps">Invitation-only research</div><h2>What do contributors do?</h2><p>Participants listen to curated recordings, describe their impressions in a structured journal, and may suggest traditions, artists, or performances for future consideration.</p><p class="note">Journal responses and musical suggestions are accepted only from individually approved participants using their invited Google accounts.</p></div></div></section><section class="section soft"><div class="wrap two"><div><div class="caps">Future participation</div><h2>Interested in joining?</h2><p class="intro"><strong>We are not currently accepting new research participants.</strong> Visitors may join an interest list to be considered if future opportunities become available.</p><p>Joining an interest list does not guarantee an invitation or give access to the private journal.</p></div><div class="panel"><h2>Interest list</h2><p>We are preparing a short form for your name, email address and an optional note about what interests you. Contact information will be used only for possible research invitations, not marketing.</p><p><a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSf01F_m4VDF4p5CzAMCp2sPrI6_FdEgDMnvk-dkl4h3s2MI9Q/viewform" target="_blank" rel="noopener noreferrer">Join the Interest List ↗</a></p><p class="note">The registration form opens in Google Forms. Submitting your interest does not create a research account or grant journal access.</p><div class="note" style="border-top:1px solid #54737c;margin-top:22px;padding-top:15px"><strong>Withdraw My Interest</strong><p>You may request removal of your interest-list registration at any time. Use the Google account whose verified email matches the address you registered with.</p><p><a class="inline-link" href="https://docs.google.com/forms/d/e/1FAIpQLSeOJf-YaqGxltFPWjmPW_mCGONi73-cihb3BIeyiZWY2g0Asg/viewform" target="_blank" rel="noopener noreferrer">Withdraw My Interest ↗</a></p><p class="note">Google sign-in is required. If you registered with a different email address, this automated verification cannot remove that registration. The form confirms receipt; only the completed processing record confirms deletion. No email is sent.</p></div></div></div></section><section class="section"><div class="wrap"><h2>From interest to invitation</h2><div class="features"><div class="feature"><span class="symbol">1</span><h3>Express interest</h3><p>Complete the public interest-list form to express interest in future invitations.</p></div><div class="feature"><span class="symbol">2</span><h3>Private review</h3><p>Submissions remain private, with no obligation or automatic admission.</p></div><div class="feature"><span class="symbol">3</span><h3>Invitation if space opens</h3><p>Only an approved invitation can lead to access to restricted research forms.</p></div></div></div></section>`;}
function suggestion(){return `<section class="countryhero"><div class="wrap"><div class="eyebrow">Help discover the world’s music</div><h1>Suggest Music</h1><p class="lead">A music tradition, a contemporary artist, a remarkable performance, or a new way of listening—we want to hear what you think should be considered.</p></div></section><section class="section"><div class="wrap two"><div class="panel"><div class="caps">For approved participants</div><h2>Recommend a musical discovery</h2><p>Use our secure Google suggestion form. Your verified Google account identifies you privately and the proposal goes into a review queue—not directly into the published library.</p><p><a class="cta" target="_blank" rel="noopener noreferrer" href="https://docs.google.com/forms/d/e/1FAIpQLSeT0IqojPJ42JKI0xEOpBmdRTTJIUbRAOMeN8QhL7SkCrUG7A/viewform">Open Suggest Music form ↗</a></p><p class="note">Sign in with the Google account invited to participate. Submissions are considered but not automatically published.</p></div><div><h2>From suggestion to discovery</h2><p class="intro">Each recommendation is reviewed for musical context, recording accuracy and freely accessible listening before any approved entry becomes available.</p><div class="feature"><div class="symbol">1 → 2 → 3</div><h3>Submit · Review · Approve</h3><p>We confirm the source and sufficient free playback, assign a catalog identifier and publish only approved recordings.</p></div></div></div></section>`;}
function render(){const route=decodeURI((location.hash.slice(1)||'/').split('?')[0]);let page=route==='/'?home():route==='/africa'?africa():route.startsWith('/country/')?country(route.slice('/country/'.length)):route==='/crossroads'?crossroads():route==='/discoveries'?discoveries():route==='/about'?about():route==='/participate'?participate():route==='/suggest'?suggestion():explore();document.getElementById('app').innerHTML=nav(route)+`<main class="page">${page}</main>`+footer();document.getElementById('menu').addEventListener('click',()=>document.getElementById('links').classList.toggle('open'));if(route==='/africa')bindFilters('africa',R);if(route.startsWith('/country/'))bindFilters('country',R.filter(r=>r.country===route.slice('/country/'.length)));if(!['/','/africa','/crossroads','/discoveries','/about','/participate','/suggest'].includes(route)&&!route.startsWith('/country/'))bindFilters('explore',R);let form=document.getElementById('suggestForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();const s=`World Music Experiment suggestion\nType: ${document.getElementById('type').value}\nName: ${document.getElementById('name').value}\nRegion: ${document.getElementById('region').value}\nFree listening link: ${document.getElementById('musicUrl').value}\nWhy: ${document.getElementById('reason').value}`;const el=document.getElementById('suggestStatus');if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(s).then(()=>el.textContent='Copied to clipboard. No submission was made.').catch(()=>el.textContent='Copy unavailable here. No submission was made.');else el.textContent='Clipboard access is unavailable. No submission was made.'});window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();
</script></body></html>
